[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "wildlife-desk"
version = "0.1.0"
description = "Local newsroom studio, MCP server, and deterministic cover renderer for wildlife camera dispatches."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pillow>=10.0.0",
  "mcp>=1.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0.0",
]

[project.scripts]
wildlife-desk = "scripts.wildlife_desk:main"
